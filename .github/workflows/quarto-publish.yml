# Renders the site on every push and pull request. Publishing to gh-pages only
# happens on main/master. Pull requests from branches of this repository (not
# forks) additionally get a live preview deployed to Cloudflare Pages, with the
# link posted as a PR comment. One-time setup: create a Cloudflare Pages project
# named like this repository, and add the repository secrets
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID. See README-DEPLOYMENT.md.

name: Render and Publish

on:
  push:
    branches:
      - '**'
  pull_request:

  workflow_dispatch:


# you need these permissions to publish to GitHub pages
#permissions: 
#     contents: write
#     pages: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest  
    steps:
    - name: Check out repository
      uses: actions/checkout@v7
        
    - name: Set up Quarto
      uses: quarto-dev/quarto-actions/setup@v2
      env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
          # To install LaTeX to build PDF book 
          tinytex: true 
          # uncomment below and fill to pin a version
          # version: SPECIFIC-QUARTO-VERSION-HERE
      
      # add software dependencies here and any libraries
      
      # From https://github.com/actions/setup-python
      # - name: Setup Python
      #   uses: actions/setup-python@v3

      # From https://github.com/r-lib/actions/tree/v2-branch/setup-r
      # - name: Setup R
      #   uses: r-lib/actions/setup-r@v2

      # From https://github.com/julia-actions/setup-julia
      # - name: Setup Julia
      #   uses: julia-actions/setup-julia@v1

      # See more at https://github.com/quarto-dev/quarto-actions/blob/main/examples/example-03-dependencies.md

    - name: Render (without publishing)
      if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master'
      uses: quarto-dev/quarto-actions/render@v2
      with:
         path: docs

    - name: Upload rendered site as artifact
      if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master'
      uses: actions/upload-artifact@v7
      with:
        name: rendered-site
        path: docs/_site

      # NOTE: If Publishing to GitHub Pages, set the permissions correctly (see top of this yaml)
    - name: Publish to GitHub Pages (and render) 
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: quarto-dev/quarto-actions/publish@v2
      with:
         target: gh-pages
         path: docs
      env:
         GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # this secret is always available for github actions

  preview:
    needs: build-deploy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write     # only for the PR comment
    env:
      # Pages project name = GitHub repository name
      CF_PAGES_PROJECT: ${{ github.event.repository.name }}
    steps:
    - name: Download rendered site
      uses: actions/download-artifact@v8
      with:
        name: rendered-site
        path: _site
    - name: Deploy PR preview
      id: preview
      # Forked PRs cannot read secrets, and handing a deploy token to
      # unreviewed code is a bad trade for a preview.
      if: github.event.pull_request.head.repo.full_name == github.repository
      uses: cloudflare/wrangler-action@v4
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        command: >-
          pages deploy ./_site
          --project-name=${{ env.CF_PAGES_PROJECT }}
          --branch=pr-${{ github.event.pull_request.number }}
    - name: Publish preview link
      if: steps.preview.outcome == 'success'
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
        URL: ${{ steps.preview.outputs.pages-deployment-alias-url }}
      run: |
        echo "📖 Preview: $URL" >> "$GITHUB_STEP_SUMMARY"
        gh pr comment "$PR" --repo "$REPO" --edit-last --create-if-none \
          --body "📖 **Preview:** $URL — commit \`${GITHUB_SHA:0:7}\`"
